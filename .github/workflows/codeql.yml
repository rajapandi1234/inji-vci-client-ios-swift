name: "CodeQL Advanced"

on:
  push:
    branches: [ "release-0.3.x" ]
  pull_request:
    branches: [ "release-0.3.x" ]
  schedule:
    - cron: '22 23 * * 5'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            build-mode: autobuild

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # ⚙️ CodeQL attempts to automatically build Swift code
      - name: Autobuild
        if: matrix.build-mode == 'autobuild'
        uses: github/codeql-action/autobuild@v3

      # 🔍 Perform CodeQL Analysis and export SARIF
      - name: Perform CodeQL Analysis
        id: analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"
          output: codeql-output.sarif

      # 🧹 Filter SARIF results to exclude Swiftexample/
      - name: Filter SARIF results to exclude Swiftexample/
        if: matrix.language == 'swift'
        uses: advanced-security/filter-sarif@v1
        with:
          input: codeql-output.sarif
          output: filtered-codeql.sarif
          ignore-paths: |
            Swiftexample/

      # ☁️ Upload the filtered SARIF results
      - name: Upload filtered SARIF
        if: matrix.language == 'swift'
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: filtered-codeql.sarif
